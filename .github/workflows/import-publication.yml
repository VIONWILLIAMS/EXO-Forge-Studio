          destination = Path('/tmp/publication-parts')
          destination.mkdir()
          def download(item):
              index, sha, size = item
              url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}'
              headers = {'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                         'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
                          result = json.load(response)
                      raw = base64.b64decode(result['content'])
                      assert len(raw) == size
                      assert hashlib.sha1(b'blob ' + str(size).encode() + b'\0' + raw).hexdigest() == sha
                      (destination / f'{index:04d}.part').write_bytes(raw)
                      return index
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2)
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(download, item) for item in parts]
              for count, future in enumerate(as_completed(futures), 1):
                  future.result()
                  if count % 20 == 0 or count == len(parts):
                      print(f'Received and verified {count}/{len(parts)} parts', flush=True)
          with open('/tmp/release.bundle', 'wb') as output:
              for part in sorted(destination.iterdir()):
                  output.write(part.read_bytes())
