      - name: Transfer reviewed objects into the repository
        env:
          EXPECTED_COMMIT: ee3192fb0b333d3359106ec3183e0abfc5ddc6cc
        run: |
          git fetch /tmp/release.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_COMMIT"
          git read-tree "$EXPECTED_COMMIT"
          git update-index --force-remove .github/workflows/ci.yml
          git read-tree --prefix=.github/workflows/ "$GITHUB_SHA:.github/workflows"
          tree=$(git write-tree)
          git config user.name 'VIONWILLIAMS'
          git config user.email '176846999+VIONWILLIAMS@users.noreply.github.com'
          publication=$(git commit-tree "$tree" -p "$GITHUB_SHA" -m 'Transfer reviewed ATLAS workbench source and model objects')
          git push origin "$publication:refs/heads/codex/publication-assets"
          printf 'Transferred commit: `%s`\n\nSource snapshot: `%s`\n' "$publication" "$EXPECTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
